name: Recovery Builder - TWRP

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: ''
        type: choice
        options:
        - twrp-12.1
        - twrp-11
      DEVICE_TREE:
        description: 'Custom Recovery Tree' # Your already made Device Tree for TWRP
        required: true
        default: 'https://github.com/cd-Crypton/custom_recovery_tree_realme_macedonia'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' # Your Device Tree Branch, make sure it's right.
        required: true
        default: 'twrp-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path' # As is, just like your DEVICE_PATH in your BoardConfig.mk
        required: true
        default: 'device/realme/macedonia'
      DEVICE_NAME:
        description: 'Build makefile/device name hint (used to find twrp_<name>.mk or omni_<name>.mk)'
        required: true
        default: 'macedonia'
      BUILD_TARGET:
        description: 'Specify your Build Target' # Pick among boot, recovery and vendor_boot
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Display Inputs
      run: |
        echo "Displaying variables/inputs."
        echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ inputs.DEVICE_PATH }}"
        echo "Device Name Hint: ${{ inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ inputs.BUILD_TARGET }}image"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ inputs.MANIFEST_BRANCH == 'twrp-11' || inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

    - name: Initialize Repo
      run: |
        mkdir android-recovery
        cd android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ inputs.MANIFEST_BRANCH }}

    - name: Repo Sync
      run: |
        cd android-recovery
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Device Tree
      run: |
        cd android-recovery
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Check Build Makefile
      run: |
        cd android-recovery
        if [ -f ${{ inputs.DEVICE_PATH }}/twrp_${{ inputs.DEVICE_NAME }}.mk ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f ${{ inputs.DEVICE_PATH }}/omni_${{ inputs.DEVICE_NAME }}.mk ]; then
            echo "DEVICE_MAKEFILE=omni_${{ inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "No recovery makefile file found!"
            exit 1
        fi

    - name: Building Image
      run: |
        cd android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true

        lunch "${{ env.DEVICE_MAKEFILE }}-eng"

        # Do not assume the user-supplied DEVICE_NAME is identical to
        # TARGET_DEVICE or the output-directory name. Ask the Android build
        # system for the resolved values after lunch.
        TARGET_DEVICE_REAL="$(get_build_var TARGET_DEVICE)"
        PRODUCT_OUT_REAL="$(get_build_var PRODUCT_OUT)"
        if [[ "$PRODUCT_OUT_REAL" = /* ]]; then
            PRODUCT_OUT_ABS="$PRODUCT_OUT_REAL"
        else
            PRODUCT_OUT_ABS="$PWD/$PRODUCT_OUT_REAL"
        fi

        echo "Resolved TARGET_DEVICE: $TARGET_DEVICE_REAL"
        echo "Resolved PRODUCT_OUT: $PRODUCT_OUT_ABS"
        echo "TARGET_DEVICE_REAL=$TARGET_DEVICE_REAL" >> $GITHUB_ENV
        echo "PRODUCT_OUT_ABS=$PRODUCT_OUT_ABS" >> $GITHUB_ENV

        make clean
        make ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "Done building your ${{ inputs.BUILD_TARGET }}.img"

    - name: Set Other Build Properties
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        echo "VENDOR=$(echo "${{ inputs.DEVICE_PATH }}" | cut -d'/' -f2)" >> $GITHUB_ENV

    - name: Compressing TWRP Build (if Samsung)...
      if: env.VENDOR == 'samsung'
      run: |
        cd "$PRODUCT_OUT_ABS"
        if [ "${{ inputs.BUILD_TARGET }}" = "boot" ] || [ "${{ inputs.BUILD_TARGET }}" = "recovery" ]; then
          echo "Compressing ${{ inputs.BUILD_TARGET }}.img"
          tar -cvf ${{ inputs.BUILD_TARGET }}.tar ${{ inputs.BUILD_TARGET }}.img
        elif [ "${{ inputs.BUILD_TARGET }}" = "vendorboot" ]; then
          echo "Compressing vendor_boot.img"
          tar -cvf vendor_boot.tar vendor_boot.img
        else
          echo "Unknown build target. Skipping tar..."
        fi

    - name: Stage Build Artifacts
      run: |
        mkdir -p release-artifacts
        shopt -s nullglob

        if [ "${{ inputs.BUILD_TARGET }}" = "vendorboot" ]; then
            artifacts=("$PRODUCT_OUT_ABS"/vendor_boot.*)
        else
            artifacts=("$PRODUCT_OUT_ABS"/${{ inputs.BUILD_TARGET }}.*)
        fi

        if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No build artifacts found in resolved PRODUCT_OUT: $PRODUCT_OUT_ABS"
            exit 1
        fi

        cp -v "${artifacts[@]}" release-artifacts/
        echo "Staged artifacts:"
        ls -lh release-artifacts/

    - name: Upload to Release (boot and recovery)
      if: inputs.BUILD_TARGET == 'boot' || inputs.BUILD_TARGET == 'recovery'
      uses: softprops/action-gh-release@v2
      with:
        files: release-artifacts/*
        name: Unofficial TWRP for ${{ env.TARGET_DEVICE_REAL }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Resolved TARGET_DEVICE: ${{ env.TARGET_DEVICE_REAL }}
          Commit: Most recent [commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.

    - name: Upload to Release (if vendor_boot)
      if: inputs.BUILD_TARGET == 'vendorboot'
      uses: softprops/action-gh-release@v2
      with:
        files: release-artifacts/*
        name: Unofficial TWRP for ${{ env.TARGET_DEVICE_REAL }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Resolved TARGET_DEVICE: ${{ env.TARGET_DEVICE_REAL }}
          Commit: Most recent [commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.

    - name: Run LDCheck
      run: |
        ROOT="$PRODUCT_OUT_ABS/recovery/root"

        # LDCheck only makes sense when a recovery ramdisk tree exists.
        if [ ! -d "$ROOT" ]; then
            echo "No recovery/root directory at $ROOT; skipping LDCheck."
            exit 0
        fi

        cp -n tools/libneeds "$ROOT/" || true
        cp -n tools/ldcheck "$ROOT/" || true

        checked=0
        failed=0

        build_search_path() {
            local elf_class="$1"
            local libdir
            local paths=()

            if [ "$elf_class" = "ELF64" ]; then
                libdir="lib64"
            else
                libdir="lib"
            fi

            for partition in system vendor product system_ext odm; do
                for d in \
                    "$ROOT/$partition/$libdir" \
                    "$ROOT/$partition/$libdir/hw"; do
                    [ -d "$d" ] && paths+=("$d")
                done
            done

            local joined=""
            local p
            for p in "${paths[@]}"; do
                if [ -z "$joined" ]; then
                    joined="$p"
                else
                    joined="$joined:$p"
                fi
            done
            printf '%s' "$joined"
        }

        while IFS= read -r -d '' f; do
            # Skip non-ELF files instead of assuming every file in bin/lib is ELF.
            if ! readelf -h "$f" >/dev/null 2>&1; then
                continue
            fi

            elf_class="$(readelf -h "$f" 2>/dev/null | awk '/Class:/ {print $2; exit}')"
            search_path="$(build_search_path "$elf_class")"

            if [ -z "$search_path" ]; then
                echo "No matching library search path for $elf_class file: $f"
                continue
            fi

            echo "LDCheck [$elf_class]: $f"
            if ! python3 "$ROOT/ldcheck" -p "$search_path" -d "$f"; then
                failed=$((failed + 1))
            fi
            checked=$((checked + 1))
        done < <(
            find \
                "$ROOT/system/bin" \
                "$ROOT/vendor/bin" \
                "$ROOT/system/lib" \
                "$ROOT/system/lib64" \
                "$ROOT/vendor/lib" \
                "$ROOT/vendor/lib64" \
                -maxdepth 2 -type f -print0 2>/dev/null
        )

        echo "LDCheck examined $checked ELF files; checker process failures: $failed"
        echo "Done checking missing dependencies. Review unresolved-symbol output above."
      continue-on-error: true
